  </text>
  <line x1="250" y1="1670" x2="1350" y2="1670" stroke="#aaa" stroke-width="1" />
  <text x="250" y="1705" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#404040">
    <tspan x="250" dy="0">TS01: Tạo cơ sở cùng phòng ban đầu, xem danh sách/chi tiết. TS02: Cập nhật địa chỉ và tọa độ.</tspan>
  </text>
  <text x="250" y="1735" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#404040">
    <tspan x="250" dy="0">TS03: Thêm, xem, sửa, xóa phòng theo điều kiện nghiệp vụ; quản lý giá, phí, trạng thái và ảnh.</tspan>
  </text>
  <text x="250" y="1765" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#404040">
    <tspan x="250" dy="0">TD01 / TD04: Kiểm tra quyền đăng, hạn mức, phòng còn cho thuê và tin hiệu lực cùng cơ sở; sau đó chờ duyệt.</tspan>
  </text>
  <text x="250" y="1795" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#404040">
    <tspan x="250" dy="0">QT01: Quản trị viên duyệt hoặc từ chối kèm lý do; tin chỉ công khai sau khi được duyệt.</tspan>
  </text>
  <text x="250" y="1825" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#404040">
    <tspan x="250" dy="0">«include»: bắt buộc; «extend»: tùy chọn. Đăng nhập là tiền điều kiện. Các hình Chủ trọ là cùng một tác nhân.</tspan>
  </text>
