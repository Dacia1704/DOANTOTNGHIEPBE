    <tspan x="550" dy="24">Tạo tin cho thuê</tspan>
    <tspan x="550" dy="24">và gửi duyệt</tspan>
  </text>
  <ellipse cx="550" cy="1075" rx="200" ry="50" fill="white" stroke="#2b2b2b" stroke-width="1.6" />
