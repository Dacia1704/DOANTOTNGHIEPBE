<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1880" viewBox="0 0 1640 1880" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Use case quản lý cơ sở, phòng và tin đăng</title>
  <desc id="diagram-desc">Chín use case chính TS01 đến TS03, TD01 đến TD05 và QT01. Chủ trọ quản lý cơ sở, vị trí, phòng và tin đăng của mình. Quản trị viên kiểm duyệt tin. Cloudinary lưu trữ ảnh phòng. Quản lý ảnh mở rộng quản lý phòng khi thêm hoặc xóa ảnh. Tạo tin và gửi duyệt lại bao gồm kiểm tra điều kiện đăng tin. Các hình Chủ trọ là cùng một tác nhân.</desc>
  <rect width="1640" height="1880" fill="white" />
  <defs>
    <marker id="include-arrow" markerWidth="13" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#222" stroke-width="1.6" />
    </marker>
  </defs>
