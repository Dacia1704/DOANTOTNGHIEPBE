    <tspan x="1450" dy="26.88">Cloudinary</tspan>
  </text>
  <line x1="250" y1="1290" x2="1310" y2="1290" stroke="#aaa" stroke-width="1" />
  <text x="250" y="1322" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#404040">
    <tspan x="250" dy="0">TH04: Chấp nhận → tạo hợp đồng chờ xác nhận, giữ phòng 48 giờ và tự tạo PDF; từ chối → ghi nhận lý do.</tspan>
  </text>
  <text x="250" y="1351" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#404040">
    <tspan x="250" dy="0">TH06: Xác nhận thành công → hợp đồng có hiệu lực, phòng chuyển sang đã thuê.</tspan>
  </text>
  <text x="250" y="1380" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#404040">
    <tspan x="250" dy="0">Quản trị viên chỉ đọc chi tiết yêu cầu và hợp đồng/PDF. Người thuê, chủ trọ truy cập dữ liệu theo quyền.</tspan>
  </text>
  <text x="250" y="1409" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#404040">
    <tspan x="250" dy="0">«include» là hành vi bắt buộc. Đăng nhập là tiền điều kiện. Các hình cùng tên biểu diễn cùng một tác nhân.</tspan>
