<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1460" viewBox="0 0 1560 1460" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Use case quản lý yêu cầu thuê và hợp đồng</title>
  <desc id="diagram-desc">Tám use case TH01 đến TH08 của hệ thống cho thuê trọ. Người thuê gửi, theo dõi, hủy yêu cầu; xem PDF, đồng ý hoặc từ chối hợp đồng. Chủ trọ xử lý yêu cầu, xem hợp đồng và xác nhận bàn giao. Quản trị viên đọc chi tiết yêu cầu và hợp đồng. Cloudinary hỗ trợ lấy PDF. Xác nhận hợp đồng bao gồm kiểm tra phiên bản và toàn vẹn PDF. Các hình cùng tên là cùng một tác nhân.</desc>
  <rect width="1560" height="1460" fill="white" />
  <defs>
    <marker id="include-arrow" markerWidth="13" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#222" stroke-width="1.6" />
    </marker>
  </defs>
