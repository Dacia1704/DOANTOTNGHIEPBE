    <tspan x="1015" dy="24">Xác nhận bàn giao</tspan>
    <tspan x="1015" dy="24">và kết thúc thuê</tspan>
  </text>
  <ellipse cx="1015" cy="1080" rx="185" ry="43" fill="white" stroke="#2b2b2b" stroke-width="1.6" />
  <text x="1015" y="1075.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#171717">
