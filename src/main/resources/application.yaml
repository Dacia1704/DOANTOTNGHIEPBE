# ===========================================
# Local Development Configuration
# Backend chạy trực tiếp (IDE / mvnw), kết nối tới infra trong Docker
# ===========================================

server:
  port: 8080

spring:
  application:
    name: rental-management

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rental_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Rental@Root123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # V1__baseline.sql là nguồn sự thật duy nhất cho schema.
      # validate buộc ứng dụng không khởi động nếu entity lệch với migration.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Chấp nhận database đã tồn tại từ trước khi Flyway được bật.
    baseline-on-migrate: true
    baseline-version: 0
    schemas: ${DB_NAME:rental_db}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}
      timeout: 2s

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
        default-requeue-rejected: false

  web:
    pageable:
      default-page-size: 10
      max-page-size: 100

  servlet:
    multipart:
      # Giới hạn 5MB khớp với ImageValidator trong module storage.
      max-file-size: 5MB
      max-request-size: 25MB

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
    com.tamdaptit.rentalmanagement: DEBUG

app:
  cloudinary:
    cloud-name: vhbnmvru
    api-key: "143753777698223"
    api-secret: qtNpfp2NplN2khqiOu9UmC_eJUc
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlLWRldmVsb3BtZW50LXNlY3JldC1rZXktZm9yLXRlc3Rpbmctand0LXNpZ25pbmctMzItYnl0ZXMtbWluaW11bQ==}
