# ===========================================
# Local Development Configuration
# Backend chạy trực tiếp (IDE / mvnw), kết nối tới infra trong Docker
# ===========================================

server:
  port: 8080

spring:
  application:
    name: rental-management

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rental_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Rental@Root123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}
      timeout: 2s

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
        default-requeue-rejected: false

  web:
    pageable:
      default-page-size: 10
      max-page-size: 100

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
    com.tamdaptit.rentalmanagement: DEBUG

app:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlLWRldmVsb3BtZW50LXNlY3JldC1rZXktZm9yLXRlc3Rpbmctand0LXNpZ25pbmctMzItYnl0ZXMtbWluaW11bQ==}
    issuer: rental-management
    access-expiration-ms: 1800000      # 30 phút
    refresh-expiration-ms: 604800000   # 7 ngày
