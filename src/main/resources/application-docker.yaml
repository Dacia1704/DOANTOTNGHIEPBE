# ===========================================
# Docker Profile Configuration
# Dung khi chay backend trong container (production / docker-compose full).
# Backend dev chay local dung application.yaml.
# ===========================================

server:
  port: 8080

spring:
  application:
    name: rental-management

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:rental_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 2s
    elasticsearch:
      uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
        default-requeue-rejected: false

  web:
    pageable:
      default-page-size: 10
      max-page-size: 100

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
    com.tamdaptit.rentalmanagement: INFO

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: rental-management
    access-expiration-ms: 1800000
    refresh-expiration-ms: 604800000