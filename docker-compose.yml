# =====================================================================
# docker-compose.yml - INFRASTRUCTURE ONLY
# ---------------------------------------------------------------------
# File nay CHI chay cac CONG NGHE (MySQL, Redis, RabbitMQ, phpMyAdmin,
# Elasticsearch, MailHog). Backend KHONG chay trong container - ban chay backend
# o local bang IDE hoac `mvnw spring-boot:run` va no se ket noi toi
# cac service ben duoi qua localhost.
#
# Cach dung:
#   1) cp .env.docker .env
#   2) docker compose up -d
#   3) chay backend: ./mvnw spring-boot:run
# =====================================================================

services:

  # ---------- MySQL 8 ----------
  mysql:
    image: mysql:8.0
    container_name: rental-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - rental-network

  # ---------- phpMyAdmin (GUI quan ly MySQL) ----------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: rental-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      PMA_ARBITRARY: 1
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rental-network

  # ---------- Redis 7 ----------
  redis:
    image: redis:7-alpine
    container_name: rental-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rental-network

  # ---------- MailHog (SMTP test, xem email tai http://localhost:8025) ----------
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: rental-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP - backend local ket noi qua localhost:1025
      - "8025:8025"  # Web UI
    networks:
      - rental-network

  # ---------- RabbitMQ 3 (notification) ----------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rental-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"   # AMQP
      - "15672:15672"                  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - rental-network

  # ---------- Elasticsearch 8 (tim kiem tin dang) ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: rental-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - rental-network

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:

networks:
  rental-network:
    driver: bridge
